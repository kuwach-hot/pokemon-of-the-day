<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=800"/>
<title>ポケモン図鑑</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Noto+Sans+JP:wght@800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:800px;height:480px;overflow:hidden;background:#cc0000;font-family:'Noto Sans JP',sans-serif}
.pokedex{width:800px;height:480px;background:#cc0000;display:grid;grid-template-columns:396px 1fr;border:4px solid #880000;position:relative}
.top-deco{position:absolute;top:8px;left:12px;display:flex;align-items:center;gap:8px;z-index:10}
.camera{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#88ccff,#0044cc);border:3px solid #000;box-shadow:0 0 0 2px #444}
.lights{display:flex;gap:5px}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid #000}
.dot.r{background:#ff2200}.dot.y{background:#ffcc00}.dot.g{background:#00cc44}
.hinge{position:absolute;top:0;bottom:0;left:396px;width:6px;background:#880000;z-index:5;border-left:2px solid #660000;border-right:2px solid #660000}

/* 左側：ポケモン画像＋ひと回り大きくしたメタ情報・タイプ */
.left{background:#cc0000;padding:38px 10px 8px 10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;position:relative}
.left-meta{display:flex;justify-content:space-between;align-items:center;width:100%;padding:0 4px}
.meta-txt{font-family:'Orbitron','Noto Sans JP',sans-serif;font-size:17px;font-weight:900;color:#ffee00;text-shadow:1px 1px 0 #000}
.screen-bezel{width:370px;background:#222;border:5px solid #000;border-radius:8px;padding:5px;box-shadow:0 4px 0 #770000;flex-shrink:0}
.screen-inner{background:#fff;border:3px solid #000;border-radius:3px;width:100%;height:316px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
#poke-img{width:330px;height:330px;object-fit:contain;transform:scale(1.05);transform-origin:center center}
.screen-led{width:10px;height:10px;border-radius:50%;background:#00ff44;border:2px solid #000;margin:4px auto 0}

/* 下部：タイプとミニコントローラー */
.left-bottom{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.dpad{width:36px;height:36px;position:relative;flex-shrink:0}
.dpad-h,.dpad-v{position:absolute;background:#111;border:2px solid #555;border-radius:2px}
.dpad-h{top:33%;left:0;right:0;height:34%}
.dpad-v{left:33%;top:0;bottom:0;width:34%}
.dpad-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;background:#333;border-radius:50%;border:2px solid #555}
.types-row{display:flex;gap:6px;justify-content:center}
.tpill{font-family:'Noto Sans JP',sans-serif;font-size:15px;font-weight:900;letter-spacing:0.5px;padding:4px 13px;border:3px solid #000;border-radius:4px;color:#fff}
.buttons-wrap{display:flex;gap:6px;flex-shrink:0}
.btn-circle{width:24px;height:24px;border-radius:50%;border:2.5px solid #000;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:11px;font-weight:900;color:#fff}

/* 右側：全体的に文字をひと回り拡大 */
.right{background:#fff;margin-left:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;gap:9px;height:100%}
.name-row{border-bottom:3px solid #000;padding-bottom:5px;flex-shrink:0}
#poke-name{font-family:'Noto Sans JP',sans-serif;font-size:30px;font-weight:900;color:#000;line-height:1.1;letter-spacing:0.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num-genus{display:flex;gap:10px;align-items:center;margin-top:4px}
.num-tag{font-family:'Orbitron',monospace;font-size:16px;font-weight:900;color:#000}
.genus-tag{font-size:15px;font-weight:900;color:#000;letter-spacing:0.5px}

.desc-box{background:#fff;border:3px solid #000;border-radius:4px;padding:10px 11px 8px 11px;position:relative;flex-shrink:0;height:128px;display:flex;align-items:center;margin-top:4px}
.desc-box-label{position:absolute;top:-11px;left:8px;background:#fff;font-size:12px;font-weight:900;color:#000;letter-spacing:1.5px;padding:0 4px}
#poke-desc{font-size:16px;line-height:1.42;color:#000;font-weight:800;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}

.stats-section{flex:1;display:flex;flex-direction:column;justify-content:space-between;border:2.5px solid #000;border-radius:4px;padding:7px 9px 9px 9px;background:#f8f8f8}
.stats-header{font-size:13.5px;font-weight:900;letter-spacing:1px;color:#000;margin-bottom:3px;flex-shrink:0}
.stats-list{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:7px 10px;align-content:space-evenly}
.stat-row{display:flex;align-items:center;gap:5px}
.stat-lbl{font-family:'Orbitron',monospace;font-size:13.5px;font-weight:900;color:#000;width:38px;text-align:right;flex-shrink:0}
.stat-bar-horiz{flex:1;height:21px;background:#e0e0e0;border:2px solid #000;border-radius:3px;overflow:hidden}
.stat-fill-h{height:100%}
.stat-num{font-family:'Orbitron',monospace;font-size:13.5px;font-weight:900;color:#000;width:34px;text-align:right;flex-shrink:0}

.info-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex-shrink:0}
.chip{border:2.5px solid #000;border-radius:4px;padding:4px 4px;font-size:14px;font-weight:900;color:#000;background:#fff;white-space:nowrap;text-align:center}
</style>
</head>
<body>
<div class="pokedex">
  <div class="top-deco">
    <div class="camera"></div>
    <div class="lights"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div>
  </div>
  <div class="hinge"></div>
  <div class="left">
    <div class="left-meta">
      <span class="meta-txt" id="num-stamp">#0001</span>
      <span class="meta-txt" style="font-size:13.5px;max-width:240px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="genus-tag-left"></span>
    </div>
    <div class="screen-bezel">
      <div class="screen-inner">
        <img id="poke-img" src="" alt="" width="330" height="330"/>
      </div>
      <div class="screen-led"></div>
    </div>
    <div class="left-bottom">
      <div class="dpad"><div class="dpad-h"></div><div class="dpad-v"></div><div class="dpad-center"></div></div>
      <div class="types-row" id="types-row"></div>
      <div class="buttons-wrap">
        <div class="btn-circle" style="background:#0044cc">A</div>
        <div class="btn-circle" style="background:#cc0000">B</div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="name-row">
      <div id="poke-name">—</div>
      <div class="num-genus">
        <span class="num-tag" id="num-tag2"></span>
        <span class="genus-tag" id="genus-tag"></span>
      </div>
    </div>
    <div class="desc-box">
      <div class="desc-box-label">図鑑説明</div>
      <p id="poke-desc">—</p>
    </div>
    <div class="stats-section">
      <div class="stats-header">種族値 (BASE STATS)</div>
      <div class="stats-list" id="stats-list"></div>
    </div>
    <div class="info-row" id="info-row"></div>
  </div>
</div>

<script>
const SL={hp:'HP',attack:'ATK',defense:'DEF','special-attack':'SpA','special-defense':'SpD',speed:'SPD'};
const SC={hp:'#dd0000',attack:'#dd5500',defense:'#0044cc','special-attack':'#7700bb','special-defense':'#007722',speed:'#0088aa'};
const TC={fire:'#dd2200',water:'#0055cc',grass:'#226600',electric:'#bb8800',psychic:'#cc0055',ice:'#0088aa',dragon:'#2200cc',dark:'#111',fairy:'#aa0066',normal:'#556655',fighting:'#aa0000',flying:'#1133aa',poison:'#7700aa',ground:'#885500',rock:'#665500',bug:'#335500',ghost:'#330077',steel:'#334455',unknown:'#333'};
const TN={fire:'ほのお',water:'みず',grass:'くさ',electric:'でんき',psychic:'エスパー',ice:'こおり',dragon:'ドラゴン',dark:'あく',fairy:'フェアリー',normal:'ノーマル',fighting:'かくとう',flying:'ひこう',poison:'どく',ground:'じめん',rock:'いわ',bug:'むし',ghost:'ゴースト',steel:'はがね',unknown:'不明'};
const HAB={cave:'洞窟',forest:'森林',grassland:'草原',mountain:'山岳',rare:'希少','rough-terrain':'荒地',sea:'海',urban:'市街地','waters-edge':'水辺'};

const id = Math.floor(Math.random() * 1025) + 1;
const imgEl = document.getElementById('poke-img');
imgEl.src = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + id + '.png';

function pickJa(list) {
  if (!list) return null;
  return list.find(e => e.language.name === 'ja')
      || list.find(e => e.language.name === 'ja-Hrkt')
      || list.find(e => e.language.name === 'en');
}

async function load() {
  try {
    const [pr, sr] = await Promise.all([
      fetch('https://pokeapi.co/api/v2/pokemon/' + id).then(r => r.json()),
      fetch('https://pokeapi.co/api/v2/pokemon-species/' + id).then(r => r.json())
    ]);

    const nameObj = pickJa(sr.names);
    document.getElementById('poke-name').textContent = nameObj ? nameObj.name : pr.name;

    const numStr = '#' + String(pr.id).padStart(4, '0');
    document.getElementById('num-stamp').textContent = numStr;
    document.getElementById('num-tag2').textContent = numStr;

    const g = pickJa(sr.genera);
    const genus = g ? g.genus : '';
    document.getElementById('genus-tag').textContent = genus;
    document.getElementById('genus-tag-left').textContent = genus;

    document.getElementById('types-row').innerHTML = pr.types.map(t =>
      '<div class="tpill" style="background:' + (TC[t.type.name] || '#333') + '">' + (TN[t.type.name] || t.type.name) + '</div>'
    ).join('');

    let entries = (sr.flavor_text_entries || []).filter(e => e.language.name === 'ja');
    if (entries.length === 0) entries = (sr.flavor_text_entries || []).filter(e => e.language.name === 'ja-Hrkt');
    if (entries.length === 0) entries = (sr.flavor_text_entries || []).filter(e => e.language.name === 'en');
    const pk = entries[Math.floor(Math.random() * Math.min(entries.length, 6))];
    document.getElementById('poke-desc').textContent = pk ? pk.flavor_text.replace(/[\f\n\r\u3000]/g, '') : '図鑑データがありません。';

    document.getElementById('stats-list').innerHTML = pr.stats.map(s => {
      const p = Math.min(100, Math.round((s.base_stat / 255) * 100));
      return '<div class="stat-row"><div class="stat-lbl">' + (SL[s.stat.name] || s.stat.name) + '</div><div class="stat-bar-horiz"><div class="stat-fill-h" style="width:' + p + '%;background:' + (SC[s.stat.name] || '#000') + '"></div></div><div class="stat-num">' + s.base_stat + '</div></div>';
    }).join('');

    const ht = (pr.height / 10).toFixed(1);
    const wt = (pr.weight / 10).toFixed(1);
    const genNum = (sr.generation?.name || '').replace('generation-', '');
    const genMap = {i:'第1世代',ii:'第2世代',iii:'第3世代',iv:'第4世代',v:'第5世代',vi:'第6世代',vii:'第7世代',viii:'第8世代',ix:'第9世代'};
    const gen = genMap[genNum] || '—';
    const habKey = sr.habitat?.name;
    const hab = habKey ? (HAB[habKey] || habKey) : '不明';
    document.getElementById('info-row').innerHTML =
      '<div class="chip">高さ: ' + ht + ' m</div>' +
      '<div class="chip">重さ: ' + wt + ' kg</div>' +
      '<div class="chip">' + gen + '</div>' +
      '<div class="chip">生息地: ' + hab + '</div>';

  } catch(e) {
    document.getElementById('poke-name').textContent = '通信エラー';
    document.getElementById('poke-desc').textContent = 'データを取得できませんでした。';
  }
}
load();
</script>
</body>
</html>
